gate:
  id: janus_15_asr_model_comparison
  scope: reviewed 15-row JANUS pilot subset only
  locale: zh-TW
  speech_language_profile: Taiwan Traditional Chinese call-center Mandarin
  transcript_script: Traditional Chinese
  input_manifest: 40_breeze_asr25_finetune_dataset/manifests/nemo_pilot_input_manifest.jsonl
  gold_review: 40_breeze_asr25_finetune_dataset/reports/gold_subset_review.tsv
  output_contract:
    required_columns:
      - audio_id
      - hypothesis_text
    quality_columns:
      - wer
      - cer
    decision_columns:
      - asr_label
      - would_asr_error_change_decision
  human_review:
    additional_required_before_15_row_model_comparison: false
    reason: >
      The fixed 15-row gold review and 6-row long-silence review already provide
      the human reference needed for the first model comparison. Additional
      manual review is only a bounded spot check when model outputs disagree on
      decision-critical spans.
    optional_spot_check_packet: /home/jnln3799/Downloads/janus_15_human_review_packet_2026-05-25/janus_15_model_output_spot_check_guide_2026-05-25.md

language_control:
  required_locale: zh-TW
  required_script: Traditional Chinese
  disallowed_script: Simplified Chinese
  task_policy: transcribe_original_speech_only
  output_policy:
    - Use Taiwan Traditional Chinese wording and characters.
    - Do not translate to English.
    - Do not summarize.
    - Do not output Simplified Chinese characters.
    - Store raw hypotheses only in ignored local prediction paths.
  model_specific_controls:
    whisper:
      language_arg: zh
      task_arg: transcribe
      post_decode_gate: traditional_zh_tw_locale_check
      note: Whisper exposes Chinese language control but not a zh-TW token, so
        all Whisper-family outputs require an explicit Traditional Chinese
        locale gate after decoding.
    sensevoice:
      language_arg: zh
      use_itn: true
      post_decode_gate: traditional_zh_tw_locale_check
    qwen3_asr:
      language_arg: zh
      prompt_or_request_locale: Taiwan Traditional Chinese
      post_decode_gate: traditional_zh_tw_locale_check
    gemma4_audio:
      prompt: >
        請逐字轉錄以下台灣電話客服語音，輸出繁體中文（台灣用語），不得輸出簡體中文；
        只輸出轉錄內容，不要翻譯，不要摘要。
      post_decode_gate: traditional_zh_tw_locale_check

candidate_models:
  - run_id: nemo_curator_zh_citrinet_cpu_pilot
    model_name_or_path: nvidia/stt_zh_citrinet_1024_gamma_0_25
    family: NeMo ASR
    role: curation output-contract and joinability check
    current_status: pilot_contract_passed_cpu
    direct_quality_baseline: false
    notes: Existing pilot quality was too weak for Taiwan 165 calls; keep it as
      a pipeline check unless a better NeMo Mandarin or Taiwan-facing model is
      selected later.

  - run_id: whisper_small_15_row_baseline
    model_name_or_path: openai/whisper-small
    family: Whisper
    role: low-cost full 15-row baseline after the 1-row smoke pass
    current_status: completed_15_row_cuda_no_cudnn
    direct_quality_baseline: true
    notes: Use this before large models to verify the complete 15-row
      hypothesis, metric, and label bridge.

  - run_id: whisper_large_v2_15_row_baseline
    model_name_or_path: openai/whisper-large-v2
    family: Whisper
    role: main Whisper-family 15-row baseline before LoRA training
    current_status: completed_15_row_cuda_no_cudnn
    direct_quality_baseline: true
    notes: Run inference on the reviewed subset before any long LoRA training.

  - run_id: breeze_asr25_15_row_baseline
    model_name_or_path: MediaTek-Research/Breeze-ASR-25
    family: Breeze ASR
    role: Taiwan Mandarin and Traditional Chinese domain baseline
    current_status: completed_15_row_cuda_no_cudnn
    direct_quality_baseline: true
    notes: Primary Breeze candidate for this corpus because the model card
      targets Traditional Chinese and Taiwanese Mandarin/code-switching.

  - run_id: breeze_asr26_15_row_stress_test
    model_name_or_path: MediaTek-Research/Breeze-ASR-26
    family: Breeze ASR
    role: optional Taigi/Taiwanese Hokkien stress test
    current_status: completed_15_row_cuda_no_cudnn_optional
    direct_quality_baseline: false
    notes: Breeze-ASR-26 is Taigi/Hokkien-oriented and outputs Chinese
      characters. Use it to test possible Taigi/Hokkien speech or dialect
      robustness, not as the primary Taiwan Mandarin baseline.

  - run_id: whisper_large_v3_15_row_baseline
    model_name_or_path: openai/whisper-large-v3
    family: Whisper
    role: newer Whisper large checkpoint for Taiwan Traditional Chinese
      comparison against large-v2 and Breeze candidates
    current_status: completed_15_row_contract_passed_locale_not_clean
    direct_quality_baseline: true
    language_control_ref: language_control.model_specific_controls.whisper
    source_url: https://huggingface.co/openai/whisper-large-v3
    notes: One-row CUDA smoke passed on 2026-05-25 with cuDNN disabled,
      float16, `zh_asr`, `jieba`, and zero locale violations. The fixed 15-row
      gate then passed the hypothesis contract with CER 33.77, WER 43.18,
      wall time 14.59s, but had 2 locale-violation rows and 23 simplified
      characters. Do not promote to 258-row until the strict Taiwan
      Traditional Chinese reporting/conversion policy is audited.

  - run_id: whisper_large_v3_turbo_15_row_baseline
    model_name_or_path: openai/whisper-large-v3-turbo
    family: Whisper
    role: speed/quality tradeoff comparator against large-v3 and Breeze
    current_status: completed_15_row_contract_passed_locale_not_clean
    direct_quality_baseline: true
    language_control_ref: language_control.model_specific_controls.whisper
    source_url: https://huggingface.co/openai/whisper-large-v3-turbo
    notes: One-row CUDA smoke passed on 2026-05-25 with cuDNN disabled,
      float16, `zh_asr`, `jieba`, and zero locale violations. The fixed 15-row
      gate then passed the hypothesis contract with CER 41.33, WER 52.52,
      wall time 7.68s, but had 4 locale-violation rows and 48 simplified
      characters. Keep it as a speed/quality smoke comparator only.

  - run_id: sensevoice_small_15_row_candidate
    model_name_or_path: FunAudioLLM/SenseVoiceSmall
    family: FunASR SenseVoice
    role: non-autoregressive multilingual ASR comparator with speech
      understanding side signals
    current_status: smoke_1_row_completed_contract_passed_locale_failed
    direct_quality_baseline: true
    language_control_ref: language_control.model_specific_controls.sensevoice
    source_url: https://huggingface.co/FunAudioLLM/SenseVoiceSmall
    notes: FunASR/modelscope were installed locally on 2026-05-25 and
      `run_janus_sensevoice_pilot.py` now emits the standard hypothesis
      contract. One-row CUDA smoke passed with CER 65.88, WER 81.25, cached
      runner wall time 2.15s, but failed the strict locale gate with 1
      locale-violation row and 11 simplified characters. Do not promote to
      15-row until the Taiwan Traditional Chinese output policy is audited.

  - run_id: qwen3_asr_0_6b_15_row_candidate
    model_name_or_path: Qwen/Qwen3-ASR-0.6B
    family: Qwen3-ASR
    role: smaller Qwen3-ASR smoke and latency candidate before 1.7B
    current_status: smoke_1_row_completed_contract_passed_locale_failed_disable_cudnn
    direct_quality_baseline: true
    language_control_ref: language_control.model_specific_controls.qwen3_asr
    source_url: https://huggingface.co/Qwen/Qwen3-ASR-0.6B
    notes: `qwen-asr` was installed locally on 2026-05-25 and
      `run_janus_qwen3_asr_pilot.py` now emits the standard hypothesis
      contract. The first CUDA attempt failed with a cuDNN sublibrary mismatch;
      rerun with cuDNN disabled passed one row with CER 74.12, WER 95.83,
      cached runner wall time 6.45s, but failed the strict locale gate with 1
      locale-violation row and 13 simplified characters. Do not promote to
      15-row until the Traditional Chinese gate is fixed.

  - run_id: qwen3_asr_1_7b_15_row_candidate
    model_name_or_path: Qwen/Qwen3-ASR-1.7B
    family: Qwen3-ASR
    role: stronger Qwen3-ASR quality candidate after 0.6B smoke
    current_status: stopped_before_inference_after_0_6b_locale_failed
    direct_quality_baseline: true
    language_control_ref: language_control.model_specific_controls.qwen3_asr
    source_url: https://huggingface.co/Qwen/Qwen3-ASR-1.7B
    notes: Hugging Face model availability was checked on 2026-05-25. A bounded
      1-row load attempt was stopped before inference after stalling at model
      file fetch/load with no GPU activity. Since Qwen3-ASR-0.6B already
      failed the strict Traditional Chinese locale gate, retry 1.7B only after
      the 0.6B lane passes locale control.

  - run_id: gemma4_e4b_audio_15_row_candidate
    model_name_or_path: unsloth/gemma-4-E4B
    family: Gemma 4 multimodal audio
    role: prompted multimodal ASR and decision-text comparator, not a pure ASR
      model
    current_status: blocked_local_transformers_multimodal_class_missing
    direct_quality_baseline: false
    language_control_ref: language_control.model_specific_controls.gemma4_audio
    source_url: https://huggingface.co/unsloth/gemma-4-E4B
    notes: Hugging Face model availability was checked on 2026-05-25. Local
      Transformers 4.57.6 does not expose `AutoModelForMultimodalLM`, while the
      Gemma 4 config declares a 5.5.0.dev0-era runtime with audio config
      present. Use only after an isolated multimodal runner can emit the same
      output contract. Do not mix Gemma output into pure ASR baseline tables.

  - run_id: gemma4_e2b_audio_15_row_candidate
    model_name_or_path: unsloth/gemma-4-E2B
    family: Gemma 4 multimodal audio
    role: smaller prompted multimodal ASR and latency candidate
    current_status: blocked_local_transformers_multimodal_class_missing
    direct_quality_baseline: false
    language_control_ref: language_control.model_specific_controls.gemma4_audio
    source_url: https://huggingface.co/unsloth/gemma-4-E2B
    notes: Hugging Face model availability was checked on 2026-05-25. Local
      Transformers 4.57.6 does not expose `AutoModelForMultimodalLM`, while the
      Gemma 4 config declares a 5.5.0.dev0-era runtime with audio config
      present. Use as the cheaper multimodal smoke only after an isolated Gemma
      4 audio runtime exists and can pass the same Traditional Chinese locale
      gate.
