<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="276" viewBox="0 0 1600 276">
<rect width="1600" height="100%" fill="white"/>
<text x="70" y="70" font-family="DejaVu Sans, Arial, sans-serif" font-size="42" font-weight="700" fill="#1F2933">Fixed-budget row-level replay frontier</text>
<text x="70" y="120" font-family="DejaVu Sans, Arial, sans-serif" font-size="25" fill="#52606D">10%, 20%, 30%, and 40% budgets map to 30, 60, 90, and 120 selected rows.</text>
<text x="70" y="154" font-family="DejaVu Sans, Arial, sans-serif" font-size="25" fill="#52606D">SRES, CEIS, and fusion have zero severe rows remaining in the final descriptive replay.</text>
<text x="70" y="188" font-family="DejaVu Sans, Arial, sans-serif" font-size="25" fill="#52606D">Variant-count-only leaves 5 severe rows at 10% and 2 severe rows at 20%.</text>
<text x="70" y="222" font-family="DejaVu Sans, Arial, sans-serif" font-size="25" fill="#52606D">Claims use worst-case tie handling at the score boundary.</text>
</svg>
