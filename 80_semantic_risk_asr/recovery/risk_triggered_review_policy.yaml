version: 0.1.0
policy_name: risk_triggered_review_policy
purpose: Trigger targeted human confirmation or re-listening for decision-critical ASR errors.

triggers:
  semantic_risk_score:
    priority_review_threshold: 20
    critical_review_threshold: 45
  error_types_always_review:
    - negation
    - amount
    - action
  downstream_impact:
    review_threshold: 2
    critical_threshold: 3

actions:
  human_confirmation:
    when: SRES is high or error type is decision-critical.
    output: Flag transcript span for human confirmation.
  targeted_relistening:
    when: Critical span is likely corrupted but audio is available.
    output: Ask reviewer to relisten only to the affected segment.
  priority_review:
    when: Possible false low-risk routing affects money/action/identity/urgency.
    output: Move case to priority human review queue.
  uncertainty_disclosure:
    when: transcript is used downstream despite unresolved risk.
    output: Show uncertainty note with affected field and risk type.

non_goals:
  - automatic final fraud determination
  - autonomous escalation without human confirmation
  - publication of raw call transcript examples
