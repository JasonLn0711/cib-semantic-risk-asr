version: 0.2.0
policy_name: cds_asr_automatic_recovery_policy
purpose: Trigger automatic constrained recovery for decision-unstable ASR spans without using human review as the method.

triggers:
  counterfactual_escalation_instability_score:
    priority_redecode_threshold: 5
    critical_interval_threshold: 10
  semantic_risk_score_baseline:
    priority_redecode_threshold: 20
    critical_interval_threshold: 45
  error_types_always_review:
    - negation
    - amount
    - action
  downstream_impact:
    redecode_threshold: 2
    critical_interval_threshold: 3

actions:
  span_level_forced_alignment:
    when: CEIS is high and token timestamps are available.
    output: Align the high-risk span back to the audio window.
  constrained_redecoding:
    when: The high-risk atom has a finite grammar, such as amount, negation, action, time, or intent.
    output: Re-decode only the affected span using the risk-atom grammar.
  asr_ensemble_arbitration:
    when: Multiple ASR models or n-best hypotheses are available.
    output: Compare candidate risk atoms across models and select the acoustically best-supported variant.
  decision_interval_estimation:
    when: Plausible variants produce different downstream labels.
    output: Emit a label interval instead of a single low-risk label.
  conservative_machine_action:
    when: The decision interval includes priority_review or critical_escalation.
    output: Avoid no_escalation and choose the lowest safe machine label in the interval.

non_goals:
  - automatic final fraud determination
  - using human review as the proposed recovery method
  - replacing downstream legal or police judgment
  - publication of raw call transcript examples
